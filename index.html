<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CashPlus</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{background:#111;padding:25px;text-align:center;border-bottom:2px solid #d4af37}
h1{color:#d4af37;font-size:32px}
main{padding:20px;max-width:600px;margin:auto}
.card{background:#191919;padding:22px;border-radius:15px;margin:18px 0;border:1px solid #51451e}
.balance{font-size:32px;color:#d4af37;font-weight:bold}
button{background:#d4af37;color:#111;border:0;padding:13px;border-radius:8px;font-weight:bold;width:100%;margin-top:12px}
input{width:100%;padding:13px;margin-top:10px;border-radius:8px;border:1px solid #555;background:#222;color:white}
h2{color:#d4af37}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>CashPlus</h1>
<p>Votre argent, votre liberté.</p>
</header>
<main>
<div class="card">
<h2>Mon solde</h2>
<div class="balance">0 FCFA</div>
<p>Bienvenue sur CashPlus !</p>
</div>
<div class="card">
<h2>Créer un compte</h2>
<input type="text" placeholder="Votre nom complet">
<input type="tel" placeholder="Votre numéro de téléphone">
<input type="password" placeholder="Créer un mot de passe">
<button onclick="alert('Inscription bientôt disponible !')">S'inscrire</button>
</div>
<div class="card">
<h2>Retrait</h2>
<p>Retrait minimum : 1 000 FCFA</p>
<input type="number" placeholder="Montant à retirer">
<button onclick="alert('Service de retrait bientôt disponible !')">Demander un retrait</button>
</div>
</main>
<footer>© 2026 CashPlus - Tous droits réservés</footer>
</body>
</html>
